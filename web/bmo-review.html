<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMO Tower · Model review</title>
<style>
body{margin:0;background:#cfd9dc;color:#17262d;font:15px system-ui}canvas{display:block;width:100vw;height:100vh}
header{position:absolute;top:16px;left:18px;background:#f6f4efed;padding:12px 16px;border-radius:8px}h1{font-size:22px;margin:0 0 5px}p{margin:0;font-size:13px}
nav{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:max-content;max-width:90vw;padding:12px;background:#f6f4ef;border-radius:10px}
button,select{font:inherit;padding:8px 12px;border:1px solid #a9b3b8;border-radius:5px;background:white;color:#17262d}button[aria-pressed=true]{background:#25373e;color:white}
</style></head>
<body><header><h1>BMO Tower</h1><p>790 North Water Street · 328 ft · owner plans and architect photographs</p></header>
<canvas aria-label="BMO Tower model preview"></canvas>
<nav aria-label="BMO Tower review controls">
<button data-angle="corner" aria-pressed="true">City Hall corner</button><button data-angle="west" aria-pressed="false">Water Street</button><button data-angle="north" aria-pressed="false">Wells Street</button><button data-angle="east" aria-pressed="false">Broadway garage</button><button data-angle="south" aria-pressed="false">South side</button><button data-angle="entry" aria-pressed="false">Lobby entrance</button><button data-angle="roof" aria-pressed="false">Roof and terraces</button>
<select aria-label="Lighting"><option>Day</option><option>Sunset</option><option>Night</option></select>
</nav>
<script type="module" src="/src/bmoReview.ts"></script></body></html>
