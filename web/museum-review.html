<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Museum · Model review</title>
<style>
html,body{height:100%;overflow:hidden}#labels{position:absolute;inset:0;pointer-events:none}header,nav{z-index:2}
body{margin:0;background:#cfd9dc;color:#17262d;font:15px system-ui}canvas{display:block;width:100vw;height:100vh}
header{position:absolute;top:16px;left:18px;background:#f6f4efed;padding:12px 16px;border-radius:8px}h1{font-size:22px;margin:0 0 5px}p{margin:0;font-size:13px}
nav{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:max-content;max-width:90vw;padding:12px;background:#f6f4ef;border-radius:10px}
button,select{font:inherit;padding:8px 12px;border:1px solid #a9b3b8;border-radius:5px;background:white;color:#17262d}button[aria-pressed=true]{background:#25373e;color:white}
</style></head>
<body><header><h1>Milwaukee Art Museum</h1><p>Lakefront gardens and bridges · 1× scale</p></header>
<div id="labels"></div><canvas aria-label="Art Museum model preview"></canvas>
<nav aria-label="Art Museum review controls">
<button data-angle="aerial" aria-pressed="true">Campus gardens</button>
<button data-angle="north" aria-pressed="false">North green corridor</button>
<button data-angle="bridge" aria-pressed="false">Mason Street bridge</button>
<button data-angle="gardens" aria-pressed="false">Cudahy Gardens</button>
<button data-angle="street" aria-pressed="false">Street level</button>
<select aria-label="Lighting"><option>Day</option><option>Sunset</option><option>Night</option></select>
</nav>
<script type="module" src="/src/museumReview.ts"></script></body></html>
