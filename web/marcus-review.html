<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marcus Center campus · Model review</title>
<style>
body{margin:0;background:#cfd9dc;color:#17262d;font:15px system-ui}canvas{display:block;width:100vw;height:100vh}
header{position:absolute;top:16px;left:18px;background:#f6f4efed;padding:12px 16px;border-radius:8px}h1{font-size:22px;margin:0 0 5px}p{margin:0;font-size:13px}
nav{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:max-content;max-width:90vw;padding:12px;background:#f6f4ef;border-radius:10px}
button,select{font:inherit;padding:8px 12px;border:1px solid #a9b3b8;border-radius:5px;background:white;color:#17262d}button[aria-pressed=true]{background:#25373e;color:white}
</style></head>
<body ><header><h1>Marcus Center campus</h1><p>1× physical scale · reference-based geometry</p></header>
<canvas aria-label="Marcus Center campus model preview"></canvas>
<nav aria-label="Marcus Center campus review controls">
<button data-angle="campus" aria-pressed="true">Whole campus</button><button data-angle="water" aria-pressed="false">Water Street</button><button data-angle="entry" aria-pressed="false">Main entrance</button><button data-angle="peck" aria-pressed="false">Peck Pavilion</button><button data-angle="lawn" aria-pressed="false">Lawn & gardens</button><button data-angle="garage" aria-pressed="false">Parking & skywalk</button><button data-angle="river" aria-pressed="false">River side</button><button data-angle="roof" aria-pressed="false">Site from above</button>
<select aria-label="Lighting"><option>Day</option><option>Sunset</option><option>Night</option></select>
</nav>
<script type="module" src="/src/marcusReview.ts"></script></body></html>
